name: Scaffold bug
description: Report a problem with the starter scaffold
title: "Scaffold bug: "
labels: ["starter-repo", "scaffold-bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What in the starter scaffold is broken?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include commands, output, and your environment.

